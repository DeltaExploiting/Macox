name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Locate Xcode project
        id: locate
        shell: bash
        run: |
          set -e
          PROJECT=$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)
          WORKSPACE=$(find . -maxdepth 3 -name '*.xcworkspace' -print -quit)
          if [ -n "$WORKSPACE" ]; then
            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJECT" ]; then
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          else
            echo 'No .xcodeproj or .xcworkspace found. Upload the Xcode project first.'
            exit 1
          fi

      - name: Build unsigned app
        shell: bash
        run: |
          set -e
          if [ -n "${{ steps.locate.outputs.workspace }}" ]; then
            xcodebuild -workspace "${{ steps.locate.outputs.workspace }}" -scheme KSignInspiredCertificates -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          else
            xcodebuild -project "${{ steps.locate.outputs.project }}" -scheme KSignInspiredCertificates -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          fi

      - name: Package IPA
        shell: bash
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf Payload KSignInspired-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry KSignInspired-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSignInspired-unsigned-ipa
          path: KSignInspired-unsigned.ipa
          if-no-files-found: error
